services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Prisma wymaga replica set (transakcje) - jednonodowy w zupelnosci wystarczy
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # inicjuje RS przy pierwszym starcie, potem to zwykly ping
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mongodb://mongo:27017/webgames?replicaSet=rs0
      CORS_ORIGINS: ${FRONTEND_URL}
    expose:
      - '8000'
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL}
    restart: unless-stopped
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${FRONTEND_URL}
    expose:
      - '3000'
    depends_on:
      - backend

volumes:
  mongo-data:
